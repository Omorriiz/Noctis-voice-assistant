name: noctis
description: "Noctis — мобильное приложение умной колонки: сопряжение по Bluetooth, настройки, таймеры, будильники, музыка, история."
publish_to: 'none'

version: 1.4.0+8

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  flutter_blue_plus: ^2.3.13
  esp_provisioning_ble: ^1.1.0
  permission_handler: ^13.0.2
  device_info_plus: ^12.0.0
  flutter_timezone: ^5.0.1
  file_picker: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Иконка приложения: assets/icon/noctis_icon.png (из присланного изображения; готовится tools/make_icon.dart)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/noctis_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/noctis_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/noctis_icon.png"
    background_color: "#05030A"
    theme_color: "#05030A"
