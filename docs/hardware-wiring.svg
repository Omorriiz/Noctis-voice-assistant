<text x="250" y="825" font-size="14" font-weight="700" fill="#14213d">Примечания</text>
<text x="250" y="847" font-size="12" fill="#14213d">• Кнопка: один контакт на GPIO11, другой на GND; резистор не нужен (включена внутренняя подтяжка). Провод до 20 см.</text>
<text x="250" y="867" font-size="12" fill="#14213d">• Кнопка BOOT (GPIO0) уже есть на плате и делает то же: 3 с — режим настройки; 5 с при включении питания — сброс (только GPIO11).</text>
<text x="250" y="887" font-size="12" fill="#14213d">• Занятые выводы: 5, 6, 7 (динамик), 8, 9 (экран), 11 (кнопка), 16, 17, 18 (микрофон).</text>
<text x="250" y="907" font-size="12" fill="#14213d">• Общая земля (GND) у всех модулей — одна. Питание всей схемы — по USB.</text>
